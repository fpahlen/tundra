name: check

on:
  push:
  pull_request:

jobs:
  tundra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r requirements-dev.txt
      - name: Check active models and samples (errors only)
        run: python tools/check_tundra.py --all
      - name: Sample regulation translation present
        run: test -f examples/regulations/dora/dora-ict-risk-governance.tundra
      - name: Provenance fixtures must fail
        run: |
          set -e
          for f in \
            examples/regulations/_fixtures/bad-cite.tundra \
            examples/regulations/_fixtures/wrong-paragraph.tundra \
            examples/regulations/_fixtures/obligations-escape.tundra \
            examples/regulations/_fixtures/no-quote-cite.tundra \
            examples/regulations/_fixtures/ellipsis-splice.tundra \
            examples/regulations/_fixtures/no-paragraph.tundra
          do
            if python tools/check_tundra.py "$f"; then
              echo "expected FAIL: $f"
              exit 1
            fi
            echo "failed as expected: $f"
          done
      - name: Negated translation warns modality mismatch
        run: |
          out=$(python tools/check_tundra.py examples/regulations/_fixtures/negated-translation.tundra 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qi 'modality mismatch' || {
            echo "expected modality mismatch warning"
            exit 1
          }
      - name: Soft modality and scope truncation warn
        run: |
          out=$(python tools/check_tundra.py examples/regulations/_fixtures/soft-modality.tundra 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qi 'softens\|modality mismatch' || {
            echo "expected soft-modality warning"
            exit 1
          }
          out2=$(python tools/check_tundra.py examples/regulations/_fixtures/truncation-scope.tundra 2>&1 || true)
          echo "$out2"
          echo "$out2" | grep -qi 'scope qualifier\|over-application' || {
            echo "expected scope-qualifier warning"
            exit 1
          }
      - name: Contract text must not widen quote scope
        run: |
          out=$(python tools/check_tundra.py examples/regulations/_fixtures/contract-widens-scope.tundra 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qi 'over-application\|widened\|does not restrict' || {
            echo "expected contract-vs-quote scope warning"
            exit 1
          }
      - name: Verify excerpt sha256 stamps
        run: python tools/verify_sources.py
      - name: Cross-instrument must not verify against other pins
        run: |
          # NIS2 must not resolve quotes via DEMO-REG skill sources
          out=$(python tools/check_tundra.py examples/regulations/_fixtures/cross-instrument.tundra 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qi 'unverified\|no excerpts for pin' || {
            echo "expected unverified warning for NIS2 without sources"
            exit 1
          }
          echo "$out" | grep -qi 'misattribution\|quote not found' && {
            echo "should not attempt quote match against wrong instrument"
            exit 1
          }
          # Must not claim hard error from DEMO-REG art-01 path
          echo "$out" | grep -q 'references/sources' && {
            echo "must not resolve NIS2 against skill DEMO sources path"
            exit 1
          }
          true
      - name: Coverage report runs
        run: python tools/check_tundra.py --coverage examples/regulations/dora/
      - name: Obligations-only sample checks clean
        run: python tools/check_tundra.py examples/regulations/dora/dora-art-5-4-board-competence.tundra
      - name: Skill regulation example checks clean
        run: python tools/check_tundra.py .grok/skills/tundra/references/example-regulation.tundra
      - name: Bad-structure fixture must fail (archived)
        run: |
          if python tools/check_tundra.py archive/legacy-process/examples/bad-structure/structurally-broken.tundra; then
            echo "expected structural fixture to FAIL"
            exit 1
          fi
      - name: Bad-contracts fixture must warn on vagueness (archived)
        run: |
          out=$(python tools/check_tundra.py archive/legacy-process/examples/bad-contracts/ 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'comparative or vague' || {
            echo "expected vagueness warning from bad-contracts fixture"
            exit 1
          }
      - name: Skill example still checks clean
        run: python tools/check_tundra.py .grok/skills/tundra/references/example.tundra

name: check

on:
  push:
  pull_request:

jobs:
  tundra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r requirements-dev.txt
      - name: Check active models and samples (errors only)
        run: python tools/check_tundra.py --all
      - name: Sample regulation translation present
        run: test -f examples/regulations/dora/dora-ict-risk-governance.tundra
      - name: Bad-cite fixture must fail
        run: |
          if python tools/check_tundra.py examples/regulations/_fixtures/bad-cite.tundra; then
            echo "expected bad cite to FAIL"
            exit 1
          fi
      - name: Coverage report runs
        run: python tools/check_tundra.py --coverage examples/regulations/dora/
      - name: Obligations-only sample checks clean
        run: python tools/check_tundra.py examples/regulations/dora/dora-art-5-4-board-competence.tundra
      - name: Skill regulation example checks clean
        run: python tools/check_tundra.py .grok/skills/tundra/references/example-regulation.tundra
      - name: Bad-structure fixture must fail (archived)
        run: |
          if python tools/check_tundra.py archive/legacy-process/examples/bad-structure/structurally-broken.tundra; then
            echo "expected structural fixture to FAIL"
            exit 1
          fi
      - name: Bad-contracts fixture must warn on vagueness (archived)
        run: |
          out=$(python tools/check_tundra.py archive/legacy-process/examples/bad-contracts/ 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'comparative or vague' || {
            echo "expected vagueness warning from bad-contracts fixture"
            exit 1
          }
      - name: Skill example still checks clean
        run: python tools/check_tundra.py .grok/skills/tundra/references/example.tundra
